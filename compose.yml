services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_DB: arcledger
      POSTGRES_USER: arcledger
      POSTGRES_PASSWORD: arcledger
    ports:
      - "5432:5432"
    volumes:
      - arcledger-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcledger -d arcledger"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  arcledger-postgres:
