spring:
  application:
    name: arc-ledger
  datasource:
    url: ${ARCLEDGER_DB_URL:jdbc:postgresql://localhost:5432/arcledger}
    username: ${ARCLEDGER_DB_USER:arcledger}
    password: ${ARCLEDGER_DB_PASSWORD:arcledger}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
arcledger:
  llm:
    provider: ${ARCLEDGER_LLM_PROVIDER:ollama}
    model: ${ARCLEDGER_LLM_MODEL:gemma3:4b}
    endpoint: ${ARCLEDGER_LLM_ENDPOINT:https://api.openai.com/v1/responses}
    api-key: ${OPENAI_API_KEY:}
  embedding:
    provider: ${ARCLEDGER_EMBEDDING_PROVIDER:ollama}
    model: ${ARCLEDGER_EMBEDDING_MODEL:embeddinggemma}
  inference:
    enabled: ${ARCLEDGER_INFERENCE_ENABLED:true}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    keep-alive: ${OLLAMA_KEEP_ALIVE:10m}
    request-timeout: ${OLLAMA_REQUEST_TIMEOUT:120s}
  retrieval:
    vector-store-provider: ${ARCLEDGER_VECTOR_STORE_PROVIDER:pgvector}
    embedding-dimensions: ${ARCLEDGER_EMBEDDING_DIMENSIONS:768}
    candidate-limit: ${ARCLEDGER_RETRIEVAL_CANDIDATE_LIMIT:50}
    semantic-weight: 0.65
    entity-weight: 0.15
    version-weight: 0.10
    recency-weight: 0.10
server:
  error:
    include-message: always
