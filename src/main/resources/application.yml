spring:
  application:
    name: arc-ledger
  datasource:
    url: ${ARCLEDGER_DB_URL:jdbc:postgresql://localhost:5432/arcledger}
    username: ${ARCLEDGER_DB_USER:arcledger}
    password: ${ARCLEDGER_DB_PASSWORD:arcledger}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 */15 * * * *"
  mail:
    host: ${ARCLEDGER_SMTP_HOST:localhost}
    port: ${ARCLEDGER_SMTP_PORT:587}
    username: ${ARCLEDGER_SMTP_USERNAME:}
    password: ${ARCLEDGER_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${ARCLEDGER_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${ARCLEDGER_SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  jackson:
    default-property-inclusion: non_null
arcledger:
  http:
    max-request-body-bytes: ${ARCLEDGER_MAX_REQUEST_BODY_BYTES:131072}
  rate-limit:
    signup:
      limit: ${ARCLEDGER_SIGNUP_RATE_LIMIT:5}
      window-seconds: ${ARCLEDGER_SIGNUP_RATE_WINDOW_SECONDS:3600}
    login:
      limit: ${ARCLEDGER_LOGIN_RATE_LIMIT:10}
      window-seconds: ${ARCLEDGER_LOGIN_RATE_WINDOW_SECONDS:60}
    scene:
      limit: ${ARCLEDGER_SCENE_RATE_LIMIT:10}
      window-seconds: ${ARCLEDGER_SCENE_RATE_WINDOW_SECONDS:300}
    question:
      limit: ${ARCLEDGER_QUESTION_RATE_LIMIT:30}
      window-seconds: ${ARCLEDGER_QUESTION_RATE_WINDOW_SECONDS:60}
    recovery:
      limit: ${ARCLEDGER_RECOVERY_RATE_LIMIT:5}
      window-seconds: ${ARCLEDGER_RECOVERY_RATE_WINDOW_SECONDS:3600}
    invitation:
      limit: ${ARCLEDGER_INVITATION_RATE_LIMIT:20}
      window-seconds: ${ARCLEDGER_INVITATION_RATE_WINDOW_SECONDS:3600}
  security:
    secure-cookies: ${ARCLEDGER_COOKIE_SECURE:true}
    allowed-origins: ${ARCLEDGER_ALLOWED_ORIGINS:http://localhost:5173}
    bcrypt-strength: ${ARCLEDGER_BCRYPT_STRENGTH:12}
    audit-hash-key: ${ARCLEDGER_AUDIT_HASH_KEY:development-only-change-me}
    admin-emails: ${ARCLEDGER_ADMIN_EMAILS:}
    require-email-verification: ${ARCLEDGER_REQUIRE_EMAIL_VERIFICATION:false}
  mail:
    enabled: ${ARCLEDGER_MAIL_ENABLED:false}
    from: ${ARCLEDGER_MAIL_FROM:noreply@arc.srishtis.dev}
    public-url: ${ARCLEDGER_PUBLIC_URL:https://arc.srishtis.dev}
  llm:
    provider: ${ARCLEDGER_LLM_PROVIDER:ollama}
    model: ${ARCLEDGER_LLM_MODEL:gemma3:4b}
    endpoint: ${ARCLEDGER_LLM_ENDPOINT:https://api.openai.com/v1/responses}
    api-key: ${OPENAI_API_KEY:}
  embedding:
    provider: ${ARCLEDGER_EMBEDDING_PROVIDER:ollama}
    model: ${ARCLEDGER_EMBEDDING_MODEL:embeddinggemma}
  inference:
    enabled: ${ARCLEDGER_INFERENCE_ENABLED:true}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    keep-alive: ${OLLAMA_KEEP_ALIVE:10m}
    request-timeout: ${OLLAMA_REQUEST_TIMEOUT:120s}
  retrieval:
    vector-store-provider: ${ARCLEDGER_VECTOR_STORE_PROVIDER:pgvector}
    embedding-dimensions: ${ARCLEDGER_EMBEDDING_DIMENSIONS:768}
    candidate-limit: ${ARCLEDGER_RETRIEVAL_CANDIDATE_LIMIT:50}
    semantic-weight: 0.65
    entity-weight: 0.15
    version-weight: 0.10
    recency-weight: 0.10
  processing:
    background-enabled: ${ARCLEDGER_BACKGROUND_PROCESSING:true}
    poll-delay-ms: ${ARCLEDGER_JOB_POLL_DELAY_MS:1000}
    batch-size: ${ARCLEDGER_JOB_BATCH_SIZE:1}
    max-attempts: ${ARCLEDGER_JOB_MAX_ATTEMPTS:3}
    retry-base-seconds: ${ARCLEDGER_JOB_RETRY_BASE_SECONDS:15}
    retry-max-seconds: ${ARCLEDGER_JOB_RETRY_MAX_SECONDS:300}
    lease-seconds: ${ARCLEDGER_JOB_LEASE_SECONDS:420}
    completed-retention-days: ${ARCLEDGER_JOB_RETENTION_DAYS:30}
  persistence:
    distributed-rate-limits: ${ARCLEDGER_DISTRIBUTED_RATE_LIMITS:true}
server:
  forward-headers-strategy: framework
  max-http-request-header-size: 16KB
  tomcat:
    max-swallow-size: 128KB
  servlet:
    session:
      timeout: ${ARCLEDGER_SESSION_TIMEOUT:12h}
      cookie:
        name: ARCLEDGER_SESSION
        http-only: true
        secure: ${ARCLEDGER_COOKIE_SECURE:true}
        same-site: lax
  error:
    include-message: never
