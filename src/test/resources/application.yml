spring:
  datasource:
    url: jdbc:h2:mem:arcledger-tests;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
arcledger:
  llm:
    provider: rule-based
  embedding:
    provider: hash
  inference:
    enabled: false
  retrieval:
    vector-store-provider: in-memory
