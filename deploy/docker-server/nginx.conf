map $http_cf_connecting_ip $arcledger_client_ip {
    default $http_cf_connecting_ip;
    "" $remote_addr;
}

server {
    listen 8080 default_server;
    server_name arc.srishtis.dev _;

    server_tokens off;
    # Keep a small proxy margin so the application can return its normalized 128 KiB JSON error.
    client_max_body_size 132k;
    error_page 413 = @payload_too_large;
    proxy_connect_timeout 30s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $arcledger_client_ip;
        proxy_set_header X-Forwarded-For $arcledger_client_ip;
        # This listener is the HTTPS Cloudflare tunnel origin; preserve that external scheme.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
    }

    location @payload_too_large {
        default_type application/json;
        add_header X-Request-ID $request_id always;
        return 413 '{"error":"PAYLOAD_TOO_LARGE","message":"The request body exceeds the allowed size.","timestamp":"$time_iso8601","requestId":"$request_id"}';
    }
}
